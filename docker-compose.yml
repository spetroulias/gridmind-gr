services:
  postgres:
    image: postgres:16
    container_name: gridmind-postgres

    environment:
      POSTGRES_DB: gridmind
      POSTGRES_USER: gridmind
      POSTGRES_PASSWORD: gridmind

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  qdrant:
    image: qdrant/qdrant:v1.17.0
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
